name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Moindre privilège : le CI ne fait que lire le code et publier des artefacts.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 25, Gradle 9)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Le jeton GITHUB_TOKEN ne reste pas écrit dans .git/config : aucune étape suivante ne pousse.
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Depuis la v6 le cache « amélioré » est un composant propriétaire soumis à conditions
          # d'utilisation ; le fournisseur basique reste sous licence MIT et suffit à ce dépôt.
          cache-provider: basic

      - name: Compile
        run: ./gradlew compileJava compileTestJava --no-daemon

      - name: Unit tests
        run: ./gradlew test --no-daemon

      # Testcontainers lève une ContainerFetchException depuis l'initialisation statique de la classe
      # de base : les 26 tests tombent alors en bloc, sans que le log dise un mot du registre. Tirer
      # les images ici rend le vrai motif visible (c'est ainsi qu'on a vu que MinIO renvoyait
      # « unauthorized » sur Quay, et pas un simple délai dépassé) et absorbe un aléa réseau.
      - name: Pre-pull Testcontainers images
        run: |
          for image in postgres:17-alpine redis:7-alpine cgr.dev/chainguard/minio:latest getmeili/meilisearch:latest; do
            for attempt in 1 2 3; do
              if docker pull --quiet "$image"; then break; fi
              echo "::warning::docker pull $image failed (attempt $attempt/3), retrying in 15s"
              sleep 15
              if [ "$attempt" = 3 ]; then
                echo "::error::unable to pull $image after 3 attempts"
                exit 1
              fi
            done
          done

      - name: Integration tests (Testcontainers)
        run: ./gradlew integrationTest --no-daemon

      # Les seuils (60 % instructions/lignes/branches/méthodes) portent sur le MÊME périmètre que
      # coverageReport, et les deux suites sont déjà exécutées : la tâche réutilise leurs données.
      - name: Coverage gate (>= 60%)
        run: ./gradlew coverageVerification --no-daemon

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-reports
          path: |
            build/reports/tests/
            build/test-results/

  frontend:
    name: Frontend (React 19, Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Le jeton GITHUB_TOKEN ne reste pas écrit dans .git/config : aucune étape suivante ne pousse.
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Vite 8 needs Node ^20.19 || >=22.12; 22 matches the project's local Node.
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check + build
        run: npm run build

      - name: Unit tests + coverage (enforces 70% thresholds)
        run: npx vitest run --coverage

  # E2E stays optional — it needs the full stack running.
  # Uncomment when a preview deployment is wired up.
  # e2e:
  #   runs-on: ubuntu-latest
  #   needs: [backend, frontend]
  #   steps:
  #     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #     - ...
