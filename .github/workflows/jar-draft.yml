# Jar déployable déposé dans une release BROUILLON, à lancer à la main (onglet Actions → Run workflow).
# Un brouillon n'est visible et téléchargeable que par les comptes ayant un accès en écriture au dépôt,
# même public (un artefact de workflow, lui, l'est pour tout le monde), et aucun tag n'est créé tant
# qu'il n'est pas publié. Ne jamais le publier : il sert uniquement à récupérer le jar.
name: Jar (release brouillon)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jar-draft
  cancel-in-progress: true

jobs:
  jar:
    name: Build du jar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Le jeton GITHUB_TOKEN ne reste pas écrit dans .git/config : aucune étape suivante ne pousse.
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Depuis la v6 le cache « amélioré » est un composant propriétaire soumis à conditions
          # d'utilisation ; le fournisseur basique reste sous licence MIT et suffit à ce dépôt.
          cache-provider: basic

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # bootJar lance aussi le build du frontend (npm install + npm run build) et l'embarque.
      - name: Build du jar
        run: ./gradlew bootJar --no-daemon

      - name: Brouillon de release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts)
          JAR="build/libs/freenote-${VERSION}.jar"
          test -f "$JAR"
          # Un seul brouillon par version : relancer le workflow remplace l'ancien au lieu d'empiler.
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.draft and .tag_name == \"v${VERSION}\") | .id" |
            while read -r id; do gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"; done
          gh release create "v${VERSION}" "$JAR" --draft --target "$GITHUB_SHA" \
            --title "Freenote ${VERSION} (${GITHUB_SHA::7})" \
            --notes "Jar construit depuis ${GITHUB_SHA::7}. Brouillon privé : ne pas publier."
