spring:
  application:
    name: freenote

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        "[format_sql]": false

  servlet:
    multipart:
      # A bit above the 7 MB business limit (enforced in PdfValidationService) so a single PDF in the
      # 7–8 MB range gets a clean 413 from the service rather than a raw multipart parse error.
      max-file-size: 8MB
      # Up to 8 images (image→PDF feature) can be sent in one request; each part is still capped at
      # max-file-size, the assembled PDF is re-checked against the 7 MB limit in ImageToPdfService.
      max-request-size: 50MB

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    oauth2:
      client:
        registration:
          discord:
            client-id: ${DISCORD_CLIENT_ID}
            client-secret: ${DISCORD_CLIENT_SECRET}
            scope: identify,email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          discord:
            authorization-uri: https://discord.com/api/oauth2/authorize
            token-uri: https://discord.com/api/oauth2/token
            user-info-uri: https://discord.com/api/users/@me
            user-name-attribute: id

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: NATIVE
  tomcat:
    remoteip:
      # Comma-separated CIDR list of trusted reverse proxies (Nginx, Cloudflare, …).
      # Unset by default — set TRUSTED_PROXIES in prod so X-Forwarded-For can't be spoofed.
      trusted-proxies: ${TRUSTED_PROXIES:}
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto

# Application custom properties
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  cookie:
    secure: ${COOKIE_SECURE:true}
  minio:
    endpoint: ${MINIO_ENDPOINT}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET:freenote-docs}
  meilisearch:
    host: ${MEILISEARCH_HOST}
    api-key: ${MEILISEARCH_API_KEY}
  email:
    hash-salt: ${EMAIL_HASH_SALT}
    from: ${MAIL_FROM:noreply@freenote.be}
    keepalive:
      # Address that receives the automatic SMTP keep-alive email. Blank = feature disabled.
      # Set it in prod (e.g. an admin inbox) so the Brevo SMTP key never expires during the
      # Jan–Aug low-traffic months (Brevo deletes keys after ~90 days of inactivity).
      to: ${MAIL_KEEPALIVE_TO:}
      # Inactivity (days) before a keep-alive is sent. 80 leaves a 10-day margin before Brevo's 90.
      threshold-days: ${MAIL_KEEPALIVE_THRESHOLD_DAYS:80}
  kofi:
    verification-token: ${KOFI_VERIFICATION_TOKEN:}
  discord:
    # Bot "rôle vérifié" — MÊME app Discord que l'OAuth login, credential séparé (Bot Token).
    # Vide (token/guild/role) = désactivé : aucun appel Discord. Le bot doit être invité sur le
    # serveur (scope bot + Manage Roles) et son rôle placé AU-DESSUS du rôle vérifié.
    bot-token: ${DISCORD_BOT_TOKEN:}
    guild-id: ${DISCORD_GUILD_ID:}
    verified-role-id: ${DISCORD_VERIFIED_ROLE_ID:}
    # Channel where the hourly "new verified documents" digest is posted. Blank = no announcements.
    announce-channel-id: ${DISCORD_ANNOUNCE_CHANNEL_ID:}
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}

freenote:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    # Bots probe with malformed request lines (path-traversal scans, the SEO {search_term_string}
    # template) and invalid third-party cookies. Tomcat rejects these before the app ever sees them;
    # only surface WARN+ from these parsers so the noise stays out of the logs.
    org.apache.coyote.http11.Http11Processor: warn
    org.apache.tomcat.util.http.parser.Cookie: warn
